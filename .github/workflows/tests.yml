name: Banking and pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-mcp.txt -r requirements-ml.txt
      - run: python -m pytest -q tests scripts/banking_acceptance_load_test.py
      - run: python -m compileall -q banking_mcp pipeline demo scripts
