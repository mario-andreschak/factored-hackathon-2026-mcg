name: Banking and pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  customer-flow-source:
    name: Customer flow source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mario-andreschak/FLUJO
          ref: 3037c1423f7d39ede4d4a9b50afae038e4dd7baa
          path: .source-flujo
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: demo/customer_v0/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: demo/customer_v0
      - run: git fetch origin 974f92787f84fc65ae425f693f79213f82b513f6 8fca9482271f2d534fb406e8674bb14b20c4776e f07cadf3dd75a20ec945cd22ed4dd4a6b4b6d344
      - run: node build.cjs --audit-provenance
        working-directory: demo/customer_v0
      # Compile/validate Git blobs only. No FLUJO server, provider or MCP process.
      - run: npm test
        working-directory: demo/customer_v0
        env:
          FLUJO_SOURCE_ROOT: ${{ github.workspace }}/.source-flujo
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-mcp.txt -r requirements-ml.txt
      - run: python -m pytest -q tests scripts/banking_acceptance_load_test.py
      - run: python -m compileall -q banking_mcp pipeline demo scripts
  frontend-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      # The frontend and MCP are separate services with independent dependency
      # pins. Test each service in the environment used by its own container.
      - run: python -m pip install -r frontend/requirements.txt pytest
      - run: python -m pip check
      - run: python -m pytest -q frontend/tests
      - run: python -m compileall -q frontend/server
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
