name: Banking and pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  savia-lite:
    name: Savia Lite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/selfcheck.mjs
        working-directory: savia-lite
  customer-flow-source:
    name: Customer language flow source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mario-andreschak/FLUJO
          ref: 3fccc557df97aba0e96ce28a8e6eebaa8e71d7d9
          path: .source-flujo
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: demo/customer_v0/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: demo/customer_v0
      - run: git fetch origin 33a07442bca62fdd438472610285dd8c427241e0
      - run: node build.cjs --audit-provenance
        working-directory: demo/customer_v0
      # Compile/validate Git blobs only. No FLUJO server, provider or MCP process.
      - run: npm test
        working-directory: demo/customer_v0
        env:
          FLUJO_SOURCE_ROOT: ${{ github.workspace }}/.source-flujo
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-mcp.txt -r requirements-ml.txt
      # The joined Gloria app has frontend dependencies and its own job below.
      - run: python -m pytest -q tests scripts/banking_acceptance_load_test.py --ignore-glob=tests/test_gloria*.py
      - run: python -m compileall -q banking_mcp pipeline demo scripts
  frontend-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      # The frontend and MCP are separate services with independent dependency
      # pins. Test each service in the environment used by its own container.
      - run: python -m pip install -r frontend/requirements.txt pytest
      - run: python -m pip check
      - run: python -m pytest -q frontend/tests
      - run: python -m compileall -q frontend/server
  frontend:
    # The joined application uses its own dependency set; service pins remain
    # independently tested above.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  gloria:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-gloria.txt
      - run: python -m pip install -r requirements-gloria.txt pytest pytest-subtests
      - run: python -m pip check
      - run: python scripts/test_gloria.py
      - run: python -m compileall -q gloria_workflow scripts/run_gloria.py
