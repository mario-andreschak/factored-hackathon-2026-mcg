name: Private synthetic source bundle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banking-synthetic-source-bundle
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'mario-andreschak/factored-hackathon-2026-mcg' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 36ae3fbfce3f5b1d5554b72a48928f55dc4bc277
          path: frontend-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Pure source gates only
        run: python -B -m unittest discover -s tests -p 'test_synthetic_integration_*.py' -v
      - name: Assemble immutable source blobs only
        run: python -B scripts/synthetic_integration/assemble_source.py --repo "$GITHUB_WORKSPACE" --frontend-repo "$GITHUB_WORKSPACE/frontend-source" --source-head "$GITHUB_SHA" --output "$RUNNER_TEMP/source-review"
      - name: Extract exact code inventory for the outer GitHub artifact
        run: python -B -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"scripts/synthetic_integration"); from contract import extract_zip; root=Path(os.environ["RUNNER_TEMP"]); extract_zip(root/"source-review/private-source-review.zip",root/"fixture-source",max_bytes=64*1024*1024)'
      - name: Upload outer GitHub source artifact
        id: source_artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-synthetic-source-${{ github.sha }}
          path: ${{ runner.temp }}/fixture-source/
          retention-days: 7
          if-no-files-found: error
      - name: Record outer artifact outputs separately from inner preview digest
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.source_artifact.outputs.artifact-id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source_artifact.outputs.artifact-digest }}
        run: python -B -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"scripts/synthetic_integration"); from assemble_source import record_hosted_publication; record_hosted_publication(Path(os.environ["RUNNER_TEMP"])/"source-review",dict(os.environ))'
      - name: Preserve source review and publication receipts separately
        uses: actions/upload-artifact@v4
        with:
          name: private-synthetic-source-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-review/source-review.json
            ${{ runner.temp }}/source-review/source-manifest.json
            ${{ runner.temp }}/source-review/hosted-publication.json
          retention-days: 7
          if-no-files-found: error
