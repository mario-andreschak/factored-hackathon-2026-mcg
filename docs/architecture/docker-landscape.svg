<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1320" width="2400" height="1320" role="img" aria-labelledby="title desc">
<title id="title">Docker · local deployment landscape</title><desc id="desc">Separate containers on Docker Desktop; host ports are published on loopback only.</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2869b2"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#117f72"/></marker>
<marker id="batch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b87412"/></marker>
<marker id="state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8052a2"/></marker>
</defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#18323d}
.title{font-size:43px;font-weight:700}.sub{font-size:22px;fill:#57707c}
.boundary{font-size:22px;font-weight:700;letter-spacing:.5px}
.kicker{font-size:17px;font-weight:700;letter-spacing:1.1px;fill:#57707c}
.node-title{font-size:27px;font-weight:700}.body{font-size:21px;fill:#365460}
.small{font-size:19px;fill:#57707c}.label{font-size:19px;font-weight:600}
.foot{font-size:21px;fill:#365460}
</style><rect width="2400" height="1320" fill="#f7fafb"/>
<text x="45" y="60" class="title">Docker · local deployment landscape</text>
<text x="45" y="100" class="sub">Separate containers on Docker Desktop; host ports are published on loopback only.</text>
<rect x="380" y="145" width="1595" height="1015" rx="22" fill="#edf3f6" stroke="#91a7b2" stroke-width="2"/>
<text x="405" y="180" class="boundary">LOCAL HOST · Windows workstation + Docker Desktop Linux VM</text>
<rect x="410" y="425" width="1535" height="345" rx="22" fill="#e8f0f7" stroke="#9eafc1" stroke-width="2" stroke-dasharray="10 7"/>
<text x="435" y="460" class="boundary">PRIVATE DOCKER NETWORK · flujo-slack_default</text>
<rect x="855" y="465" width="1060" height="280" rx="22" fill="#f0f4f8" stroke="#a8bac8" stroke-width="2"/>
<text x="880" y="500" class="boundary">FLUJO WORKER CONTAINER</text>
<g data-node="Organizer S3" data-box="45,205,280,150">
<rect x="45" y="205" width="280" height="150" rx="18" fill="#f0f5fd" stroke="#8baacf" stroke-width="2"/>
<text x="67" y="235" class="kicker">EXTERNAL SOURCE</text>
<text x="67" y="272" class="node-title">Organizer S3</text>
<text x="67" y="306" class="body">Read-only source CSVs</text>
<text x="67" y="335" class="body">Customers + products</text>
</g>
<g data-node="DuckDB pipeline" data-box="435,205,470,150">
<rect x="435" y="205" width="470" height="150" rx="18" fill="#fff9ed" stroke="#d3b27b" stroke-width="2"/>
<text x="457" y="235" class="kicker">OFFLINE · HOST PROCESS</text>
<text x="457" y="272" class="node-title">DuckDB pipeline</text>
<text x="457" y="306" class="small">Bronze → silver → gold; rejects → quarantine</text>
<text x="457" y="335" class="small">Publish CURRENT only after checks pass</text>
</g>
<g data-node="Published snapshot · /banking-data" data-box="1110,205,805,150">
<rect x="1110" y="205" width="805" height="150" rx="18" fill="#effaf6" stroke="#6bb9a2" stroke-width="2"/>
<text x="1132" y="235" class="kicker">HOST FILES · SHARED READ-ONLY BINDS</text>
<text x="1132" y="272" class="node-title">Published snapshot · /banking-data</text>
<text x="1132" y="306" class="body">CURRENT + manifests; silver customers/products; gold transaction shards</text>
<text x="1132" y="335" class="body">Same data/ directory mounted into Savia and the worker</text>
</g>
<g data-node="Browser / Savia" data-box="45,525,280,190">
<rect x="45" y="525" width="280" height="190" rx="18" fill="#f0f5fd" stroke="#8baacf" stroke-width="2"/>
<text x="67" y="555" class="kicker">LOCAL USER</text>
<text x="67" y="592" class="node-title">Browser / Savia</text>
<text x="67" y="626" class="body">http://localhost:43800</text>
<text x="67" y="655" class="body">Runs the JS/CSS UI</text>
<text x="67" y="684" class="body">Sends /api/* requests</text>
</g>
<g data-node="Savia API · :8080" data-box="435,525,325,190">
<rect x="435" y="525" width="325" height="190" rx="18" fill="#fff" stroke="#91a7b2" stroke-width="2"/>
<text x="457" y="555" class="kicker">SAVIA CONTAINER</text>
<text x="457" y="592" class="node-title">Savia API · :8080</text>
<text x="457" y="626" class="body">Serves UI assets + /api/*</text>
<text x="457" y="655" class="body">Session → approved customer</text>
<text x="457" y="684" class="body">DuckDB returns owned rows</text>
</g>
<g data-node="FLUJO · :4200" data-box="975,525,350,190">
<rect x="975" y="525" width="350" height="190" rx="18" fill="#fff" stroke="#91a7b2" stroke-width="2"/>
<text x="997" y="555" class="kicker">PRIVATE BACKEND</text>
<text x="997" y="592" class="node-title">FLUJO · :4200</text>
<text x="997" y="626" class="body">Execution token + signed user</text>
<text x="997" y="655" class="body">Pinned graph / restricted run</text>
<text x="997" y="684" class="body">Sandbox :4201 stays internal</text>
</g>
<g data-node="Banking MCP" data-box="1515,525,360,190">
<rect x="1515" y="525" width="360" height="190" rx="18" fill="#effaf6" stroke="#6bb9a2" stroke-width="2"/>
<text x="1537" y="555" class="kicker">DATA ACCESS SERVICE</text>
<text x="1537" y="592" class="node-title">Banking MCP</text>
<text x="1537" y="626" class="body">stdio; read-only customer tools</text>
<text x="1537" y="655" class="body">Checks product ownership</text>
<text x="1537" y="684" class="body">Masked facts + opaque handles</text>
</g>
<g data-node="Model provider" data-box="2100,350,260,175">
<rect x="2100" y="350" width="260" height="175" rx="18" fill="#f0f5fd" stroke="#8baacf" stroke-width="2"/>
<text x="2122" y="380" class="kicker">EXTERNAL COMPUTE</text>
<text x="2122" y="417" class="node-title">Model provider</text>
<text x="2122" y="451" class="small">Codex / configured LLM</text>
<text x="2122" y="480" class="small">Prompt + minimized facts</text>
<text x="2122" y="509" class="small">Reply → FLUJO → Savia</text>
</g>
<g data-node="Optional recheck" data-box="2100,605,260,175">
<rect x="2100" y="605" width="260" height="175" rx="18" fill="#f0f5fd" stroke="#8baacf" stroke-width="2"/>
<text x="2122" y="635" class="kicker">SAME SOURCE S3</text>
<text x="2122" y="672" class="node-title">Optional recheck</text>
<text x="2122" y="706" class="small">Only with verify_source</text>
<text x="2122" y="735" class="small">Pinned ETag HEAD / GET</text>
<text x="2122" y="764" class="small">No S3 writes</text>
</g>
<g data-node="Frontend state" data-box="435,850,325,190">
<rect x="435" y="850" width="325" height="190" rx="18" fill="#f7f0fb" stroke="#b5a0c6" stroke-width="2"/>
<text x="457" y="880" class="kicker">FRONTEND VOLUME · RW</text>
<text x="457" y="917" class="node-title">Frontend state</text>
<text x="457" y="951" class="body">/banking-state</text>
<text x="457" y="980" class="body">Sessions + public chat history</text>
<text x="457" y="1009" class="body">Queued logout revocations</text>
</g>
<g data-node="FLUJO state" data-box="975,850,350,190">
<rect x="975" y="850" width="350" height="190" rx="18" fill="#f7f0fb" stroke="#b5a0c6" stroke-width="2"/>
<text x="997" y="880" class="kicker">worker-data VOLUME · RW</text>
<text x="997" y="917" class="node-title">FLUJO state</text>
<text x="997" y="951" class="body">/data/flujo</text>
<text x="997" y="980" class="body">Flows, models, credentials</text>
<text x="997" y="1009" class="body">Conversations + owner ledger</text>
</g>
<g data-node="Banking state" data-box="1515,850,360,190">
<rect x="1515" y="850" width="360" height="190" rx="18" fill="#f7f0fb" stroke="#b5a0c6" stroke-width="2"/>
<text x="1537" y="880" class="kicker">BANK VOLUMES · RW</text>
<text x="1537" y="917" class="node-title">Banking state</text>
<text x="1537" y="951" class="body">/banking-state/banking.db</text>
<text x="1537" y="980" class="body">Handles + authorization state</text>
<text x="1537" y="1009" class="body">Separate synthetic demo state</text>
</g>
