<text x="45" y="60" class="title">Fly · hosted deployment landscape</text>
<text x="45" y="100" class="sub">One Fly Machine contains gateway, Savia, FLUJO and banking MCP; only gateway :8080 receives public traffic.</text>
<rect x="380" y="145" width="1595" height="225" rx="22" fill="#fcf7ec" stroke="#ccb27d" stroke-width="2" stroke-dasharray="10 7"/>
<text x="405" y="180" class="boundary">WORKSTATION / FIRST IMPORT · offline preparation; separate from the running Fly Machine</text>
<rect x="380" y="395" width="1595" height="765" rx="22" fill="#edf3f6" stroke="#91a7b2" stroke-width="2"/>
<text x="405" y="430" class="boundary">FLY APP · flujo-factored-2026 · iad · 1 Machine · 2 shared CPUs / 4 GB RAM</text>
<rect x="425" y="470" width="1510" height="285" rx="22" fill="#e8f0f7" stroke="#9eafc1" stroke-width="2" stroke-dasharray="10 7"/>
<text x="450" y="505" class="boundary">APPLICATION PROCESSES · UID 1000</text>
<rect x="425" y="805" width="1510" height="285" rx="22" fill="#f5eff9" stroke="#b5a0c6" stroke-width="2"/>
<text x="450" y="840" class="boundary">PERSISTENT /data VOLUME · encrypted 10 GB</text>
