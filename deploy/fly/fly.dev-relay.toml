app = "flujo-factored-dev-2026"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  FLUJO_DEV_RELAY_HOST = "flujo-factored-dev-2026.fly.dev"
  FLUJO_DEV_RELAY_EXPIRES_AT = "2026-10-16T05:00:00.000Z"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/_relay/health"
    [http_service.checks.headers]
      Host = "flujo-factored-dev-2026.fly.dev"

  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
