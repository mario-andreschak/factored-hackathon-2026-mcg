app = "flujo-factored-2026"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"
swap_size_mb = 1024

[env]
  FLUJO_DEV_UI_ENABLED = "1"
  FLUJO_DEV_UI_HOST = "flujo-factored-dev-2026.fly.dev"
  FLUJO_DEV_UI_EXPIRES_AT = "2026-10-16T05:00:00.000Z"
  FLUJO_FLY_MAIN_HOST = "flujo-factored-2026.fly.dev"
  FLUJO_FLY_USERNAME = "savia"
[[mounts]]
  source = "flujo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "1m"
    method = "GET"
    path = "/_fly/health"
    [http_service.checks.headers]
      Host = "flujo-factored-2026.fly.dev"

  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"

# Development port 8081 is private IPv6 only; its separate relay uses 6PN.

