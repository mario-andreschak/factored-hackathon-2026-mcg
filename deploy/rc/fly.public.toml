app = "savia-rc-2026"
primary_region = "iad"

[env]
RC_PUBLIC_ORIGIN = "https://savia-rc-2026.fly.dev"
RC_DEMO_CODE = "SAVIA-2026"

[[mounts]]
source = "rc_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "45s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 1
