    Salida: {"amount": null, "amount_is_approximate": false, "currency": null, "currency_raw": null, "date_from": null, "date_to": null, "date_expression": null, "merchant": null, "transaction_type": null, "channel": null, "city": null, "country": null, "transaction_id": null, "complaint_id": null, "product_hint": null, "product_last4": null, "foreign_customer_reference": true}
    Entrada: {"clean_query": "Não fiz o pix anteontem.", "current_date": "2026-03-12", "customer_currencies": ["USD"]}
    Salida: {"amount": null, "amount_is_approximate": false, "currency": null, "currency_raw": null, "date_from": "2026-03-10", "date_to": "2026-03-10", "date_expression": "anteontem", "merchant": null, "transaction_type": "Transfer", "channel": null, "city": null, "country": null, "transaction_id": null, "complaint_id": null, "product_hint": null, "product_last4": null, "foreign_customer_reference": false}
    Entrada: {"clean_query": "Compra del 20 de diciembre.", "current_date": "2026-03-12", "customer_currencies": ["COP"]}
    Salida: {"amount": null, "amount_is_approximate": false, "currency": null, "currency_raw": null, "date_from": "2025-12-20", "date_to": "2025-12-20", "date_expression": "20 de diciembre", "merchant": null, "transaction_type": "Purchase", "channel": null, "city": null, "country": null, "transaction_id": null, "complaint_id": null, "product_hint": null, "product_last4": null, "foreign_customer_reference": false}
    Entrada: {"clean_query": "Transferência no mês passado.", "current_date": "2026-03-12", "customer_currencies": ["USD"]}
    Salida: {"amount": null, "amount_is_approximate": false, "currency": null, "currency_raw": null, "date_from": "2026-02-01", "date_to": "2026-02-28", "date_expression": "mês passado", "merchant": null, "transaction_type": "Transfer", "channel": null, "city": null, "country": null, "transaction_id": null, "complaint_id": null, "product_hint": null, "product_last4": null, "foreign_customer_reference": false}
    
    Devuelve únicamente JSON válido, sin markdown ni texto adicional.
  user: |
    [clean_query]
    {{ clean_query }}
    
    [current_date]
    {{ current_date }}
    
    [customer_currencies]
    {{ customer_currencies }}
