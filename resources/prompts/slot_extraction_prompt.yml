    Entrada: {"clean_query": "Como está o caso CMP-SBX-ABC12345?", "current_date": "2026-03-12", "customer_currencies": ["USD"]}
    Salida: {"amount": null, "amount_is_approximate": false, "currency": null, "currency_raw": null, "date_from": null, "date_to": null, "date_expression": null, "merchant": null, "transaction_type": null, "channel": null, "city": null, "country": null, "transaction_id": null, "complaint_id": "CMP-SBX-ABC12345", "product_hint": null, "product_last4": null, "foreign_customer_reference": false}
